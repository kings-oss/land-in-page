<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kings Voiceover</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #d4af37;
            --blue: #1f4fd8;
            --soft-gray: #b5b5b5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
    min-height: 100vh;
    background:
        linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.55)),
        url("https://images.unsplash.com/photo-1589903308904-1010c2294adc") center/cover no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Inter', sans-serif;
    color: white;
}


        .card {
            background: rgba(8,8,8,0.78);
            backdrop-filter: blur(9px);
            border: 1px solid rgba(212,175,55,0.25);
            border-radius: 22px;
            padding: 3.6rem 3.9rem;
            max-width: 540px;
            width: 100%;
            text-align: center;
            box-shadow: 0 35px 80px rgba(0,0,0,0.95);
            animation: fadeUp 1.1s ease forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.6rem;
            letter-spacing: 3px;
            color: var(--gold);
            margin-bottom: 0.6rem;
        }

        .tagline {
            font-style: italic;
            color: var(--soft-gray);
            margin-bottom: 2.3rem;
        }

        .divider {
            height: 1px;
            width: 72%;
            margin: 2rem auto;
            background: linear-gradient(to right, transparent, var(--gold), transparent);
        }

        .contact {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            font-size: 0.95rem;
        }

        .contact a {
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .contact a:hover {
            color: var(--gold);
            letter-spacing: 0.4px;
        }

        .footer {
            margin-top: 2.7rem;
            font-size: 0.75rem;
            letter-spacing: 1.4px;
            color: var(--blue);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>KINGS VOICEOVER</h1>
        <p class="tagline">“Your Story, Your Voice”</p>

        <div class="divider"></div>

        <div class="contact">
            <a href="mailto:kingsvoiceover@gmail.com">kingsvoiceover@gmail.com</a>
            <a href="tel:+254745802657">+254 745 802 657</a>
            <a href="https://bit.ly/4nnHz6L" target="_blank">Listen to Demos</a>
        </div>

        <div class="footer">
            Nairobi, Kenya • Professional Home Studio
        </div>
    </div>

</body>
</html>
